      name: Idempotency-Key
      required: false
      schema:
        minLength: 1
        type: string
      style: simple
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: "Bad request, including malformed JSON"
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: Missing or invalid API key
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: Authenticated key cannot access this resource or environment
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: Route or scoped resource was not found
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
      description: "Conflict, including idempotency body drift"
    ValidationFailure:
