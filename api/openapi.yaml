openapi: 3.1.0
info:
  description:
    "Public Vortex Payments API for customers, subscriptions, invoices,\
    \ payment requests, checkout, receipts, webhooks, tax."
  title: Vortex Payments API
  version: 2026-08
servers:
  - description: Production
    url: https://api.vortex.nyc
  - description: Local development
    url: http://localhost:3210
tags:
  - description: Billing lifecycle routes exposed through Vortex Payments.
    name: billing
  - description: "Products, prices, and billable catalog state."
    name: catalog
  - description: Hosted checkout session flows.
    name: checkout
  - description: "Credit note, refund, and refund reconciliation flows."
    name: credit-notes
  - description: "Customer balance grants, reversals, and expiration."
    name: customer-balance
  - description: Customer profiles and payment-facing customer state.
    name: customers
  - description: Coupons and applied discount lifecycle.
    name: discounts
  - description: Product access and entitlement state.
    name: entitlements
  - description: Hosted payment and customer-facing flows.
    name: hosted
  - description: "Invoice preview, creation, finalization, collection, and lifecycle."
    name: invoices
  - description: Customer payment method setup and management.
    name: payment-methods
  - description: Payment requests and payment links.
    name: payment-requests
  - description: Payment collection and reconciliation.
    name: payments
  - description: Merchant and account payment readiness.
    name: payments-readiness
  - description: Inbound payment processor webhook boundary.
    name: provider-webhook
  - description: Receipt lookup and receipt lifecycle.
    name: receipts
  - description: Subscription creation and change lifecycle.
    name: subscriptions
  - description: "Tax quote, finalization, and evidence flows."
    name: tax
  - description: "Outbound webhook endpoints, events, deliveries, and replay."
    name: webhooks
paths:
  /healthz:
    get:
      description:
        "Generated route-discovery operation. Promoted operations in this\
        \ spec carry exact request and response schemas; use this route entry for\
        \ auth, path, idempotency, and error semantics until the route is promoted."
      operationId: get_healthz_exact
      parameters: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
          description: Success
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailure"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/ApiError"
      security: []
      summary: GET /healthz
      tags:
        - health
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |-
            curl "https://api.vortex.nyc/healthz" \
              -X GET \
        - lang: TypeScript
          label: TypeScript
          source: |-
            import { getHealthzExact, createVortex } from "@vortexnyc/payments-sdk/2026-08";

            const vortex = createVortex({ apiKey: process.env.VORTEX_API_KEY });
            const { data } = await getHealthzExact({
              client: vortex,
            });
